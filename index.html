<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢方臨床トレーニング ― 症例から煎じ薬を組み立てる</title>
<style>
:root{
  --bg:#f2ede4; --panel:#ffffff; --ink:#1e1b17; --sub:#6b6258;
  --accent:#6b4c2a; --accent2:#8c6534; --good:#2d6e44; --bad:#a83428;
  --line:#cec4b4; --chip:#ede6d8; --line-strong:#b0a494;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;}
header{background:linear-gradient(135deg,#3d2a14,#6b4c2a);color:#fdf6e8;padding:26px 5vw 22px;border-bottom:3px solid #3d2a14;}
header h1{margin:0 0 6px;font-size:1.45rem;letter-spacing:.06em;font-weight:700;}
header p{margin:0;font-size:.82rem;color:#d9c89e;line-height:1.6;}
.wrap{max-width:940px;margin:0 auto;padding:28px 5vw 80px;}

/* プログレスバー */
.progress{display:flex;gap:5px;margin-bottom:26px;flex-wrap:wrap;}
.progress span{flex:1;min-width:44px;text-align:center;padding:7px 4px;font-size:.7rem;border-radius:6px;background:var(--chip);color:var(--sub);border:1.5px solid var(--line);font-weight:500;}
.progress span.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;box-shadow:0 2px 6px rgba(107,76,42,.4);}
.progress span.done{background:#d2e8d8;color:var(--good);border-color:#8dc4a0;font-weight:600;}

/* パネル */
.panel{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:14px;padding:24px 28px;margin-bottom:22px;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.panel h2{margin-top:0;font-size:1.12rem;font-weight:700;padding:10px 14px;margin:-24px -28px 18px;background:linear-gradient(90deg,#f0e8da,#faf6ef);border-bottom:2px solid var(--line-strong);border-radius:12px 12px 0 0;color:var(--accent);}
.panel h3{font-size:.97rem;font-weight:700;color:var(--accent);margin-top:16px;margin-bottom:8px;padding-left:10px;border-left:3px solid var(--accent2);}

/* 症例文 */
.case-text{background:#faf7f0;border:1.5px solid #c8b896;border-left:5px solid var(--accent2);padding:16px 20px;border-radius:0 10px 10px 0;font-size:.94rem;white-space:pre-line;line-height:1.85;color:var(--ink);}

/* 選択肢チップ */
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.choice{padding:9px 16px;border:1.5px solid var(--line-strong);border-radius:22px;background:#fff;cursor:pointer;font-size:.86rem;user-select:none;transition:.15s;font-weight:500;}
.choice:hover{border-color:var(--accent2);background:#f5ede0;}
.choice.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.choice.correct{background:#d0e8d6;border-color:var(--good);color:var(--good);font-weight:700;}
.choice.incorrect{background:#f4d8d2;border-color:var(--bad);color:var(--bad);text-decoration:line-through;}

/* フォーム要素 */
select,input[type=number],input[type=text]{font-family:inherit;font-size:.9rem;padding:7px 10px;border:1.5px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}

/* ボタン */
.btn{display:inline-block;padding:11px 24px;background:var(--accent);color:#fff;border:none;border-radius:26px;font-size:.9rem;cursor:pointer;letter-spacing:.05em;font-weight:600;box-shadow:0 2px 8px rgba(107,76,42,.3);}
.btn:hover{background:var(--accent2);}
.btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;}
.btn.secondary:hover{background:#f5ede0;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--line-strong);font-size:.82rem;padding:8px 15px;box-shadow:none;}
.btn.ghost:hover{border-color:var(--accent2);color:var(--accent);}
.nav-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}

/* 生薬グリッド */
.herb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px;margin-top:12px;}
.herb-card{border:1.5px solid var(--line-strong);border-radius:9px;padding:9px 11px;background:#faf7f0;cursor:pointer;font-size:.8rem;position:relative;transition:.12s;}
.herb-card:hover{border-color:var(--accent2);background:#f2e9d6;}
.herb-card.active{background:#e6d8bb;border-color:var(--accent);box-shadow:0 0 0 2px rgba(107,76,42,.25);}
.herb-card .name{font-weight:700;font-size:.88rem;color:var(--ink);}
.herb-card .kana{font-size:.68rem;color:var(--sub);}
.herb-card .eff{font-size:.66rem;color:var(--sub);margin-top:2px;}
.herb-card .dose-row{margin-top:7px;display:flex;align-items:center;gap:4px;}
.herb-card input[type=number]{width:54px;}

/* バスケット */
.basket{background:#f5f0e6;border:1.5px solid var(--line-strong);border-radius:9px;padding:13px 18px;margin-top:16px;}
.basket table{width:100%;border-collapse:collapse;font-size:.86rem;}
.basket th,.basket td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);}
.basket th{color:var(--accent);font-weight:700;background:#ede6d4;border-bottom:2px solid var(--line-strong);}

/* スコアカード */
.score-box{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;}
.score-card{flex:1;min-width:140px;background:#faf7f0;border:1.5px solid var(--line-strong);border-radius:10px;padding:16px;text-align:center;}
.score-card .num{font-size:2rem;font-weight:800;color:var(--accent);}
.score-card .label{font-size:.74rem;color:var(--sub);font-weight:500;}

/* 比較テーブル */
.compare-table{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:12px;}
.compare-table th,.compare-table td{border:1.5px solid var(--line-strong);padding:7px 10px;text-align:center;}
.compare-table th{background:#ede6d4;color:var(--accent);font-weight:700;}
.tag-ok{color:var(--good);font-weight:700;}
.tag-miss{color:var(--bad);font-weight:600;}
.tag-extra{color:#8c6a1a;font-weight:600;}

/* 解説ボックス */
.explanation{background:#ecf4ee;border:1.5px solid #8dc4a0;border-left:5px solid var(--good);padding:14px 18px;border-radius:0 10px 10px 0;font-size:.9rem;margin-top:14px;line-height:1.8;}

/* 症例選択 */
.case-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;}
.case-btn{border:1.5px solid var(--line-strong);background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;font-size:.86rem;text-align:left;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.case-btn:hover{border-color:var(--accent2);background:#f5ede0;box-shadow:0 3px 10px rgba(107,76,42,.15);}
.case-btn .ttl{font-weight:700;color:var(--ink);}
.case-btn .sub{font-size:.72rem;color:var(--sub);margin-top:3px;}
.case-btn .score-tag{display:inline-block;margin-top:7px;font-size:.7rem;padding:3px 10px;border-radius:12px;font-weight:700;}
.case-btn .score-tag.done{background:#c8e8d0;color:#1e5e30;border:1px solid #8dc4a0;}
.case-btn .score-tag.notyet{background:#ede6d4;color:#7a6848;border:1px solid var(--line-strong);}

/* 習熟度パネル */
.mastery-panel{background:linear-gradient(135deg,#f0e8d8,#e6dcc8);border:1.5px solid var(--line-strong);border-radius:14px;padding:18px 22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.mastery-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.mastery-badge{padding:5px 16px;border-radius:22px;color:#fff;font-weight:700;font-size:.92rem;letter-spacing:.06em;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.mastery-stars{font-size:1.1rem;letter-spacing:2px;}
.mastery-stat{font-size:.8rem;color:var(--sub);font-weight:500;}
.cat-bars{display:grid;grid-template-columns:72px 1fr 40px;row-gap:6px;column-gap:10px;align-items:center;font-size:.78rem;}
.cat-bar-track{height:10px;background:#d6cbb8;border-radius:5px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:5px;}
.mastery-reset{font-size:.72rem;color:var(--sub);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}

/* 古典出典ボックス */
.kotenseki-box{background:#fdf8ec;border:1.5px solid #c8a040;border-radius:10px;padding:16px 20px;margin-top:4px;}
.kotenseki-source{font-size:.78rem;color:#7a5c1a;font-weight:700;margin-bottom:8px;padding:4px 10px;background:#f5e8c0;border-radius:5px;display:inline-block;}
.kotenseki-quote{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:.92rem;color:#2c1e08;background:#fdf0d0;border-left:4px solid #c8a040;padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0;line-height:1.9;}
.kotenseki-modern{font-size:.85rem;color:#3e2c10;line-height:1.85;border-top:1px solid #e0cc90;padding-top:10px;margin-top:6px;}

/* 診察所見ボックス */
.note{font-size:.75rem;color:var(--sub);margin-top:6px;}
.shinsatsu-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-top:14px;}
.shinsatsu-item{background:#faf7f0;border:1.5px solid var(--line-strong);border-radius:9px;padding:11px 14px;font-size:.83rem;line-height:1.6;}
.shinsatsu-item .sh-label{font-weight:700;color:var(--accent);font-size:.72rem;letter-spacing:.04em;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--line);}

/* 患者写実イラスト */
.patient-photo{width:210px;height:210px;object-fit:cover;border-radius:14px;border:2px solid var(--line-strong);box-shadow:0 4px 14px rgba(0,0,0,.18);background:#eee;display:block;margin:0 auto 6px;}
.patient-photo.improved{border-color:var(--good);box-shadow:0 4px 16px rgba(45,110,68,.35);}
.patient-photo.poor{border-color:#8a8a8a;filter:saturate(.75);}
.label{font-size:.78rem;color:var(--sub);font-weight:600;margin-top:4px;}
@media (max-width:600px){.patient-photo{width:160px;height:160px;}}
footer{text-align:center;padding:30px 5vw;color:var(--sub);font-size:.75rem;border-top:1.5px solid var(--line-strong);background:#ede6d8;}
.legend{font-size:.72rem;color:var(--sub);margin-top:4px;}
.disclaimer{background:#fff8ec;border:1.5px solid #d4a84a;border-left:5px solid #c89020;border-radius:10px;padding:13px 18px;font-size:.8rem;color:#6b4c10;margin-bottom:22px;line-height:1.75;}
</style>
</head>

<header>

  <p>症例を読み解き → 漢方的診断（八綱・気血水・五臓） → 方証の決定 → 治法の決定 → 生薬を一つずつ選んで処方を構成する、学習用シミュレーターです。</p>
</header>

  kotenseki:{source:"傷寒論（張仲景・後漢）第12条",quote:"太陽中風、陽浮而陰弱…汗出悪風者、桂枝湯主之。",modern:"「表の気が浮いて発熱し、裏の気が弱く、汗が出て風を嫌がる太陽中風には桂枝湯を用いよ」という意味です。桂皮・生姜で体を温め、芍薬・大棗で営血を補い、甘草で調和する5味の方剤です。葛根湯・麻黄湯より穏やかで虚証向けの表証薬です。"}},

  text:"28歳男性、スポーツ選手。突然の高熱（39.5℃）、悪寒戦慄、全身の関節痛と腰痛。発汗はなく、皮膚は乾燥して熱感が強い。脈は浮いて力強い（浮緊有力）。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"寒",hyori:"表"},
  rokubyoi:"太陽病",
  kiketsu:["該当せず"], gozou:["該当せず"],
  houshou:"麻黄湯証", formula:"maoto",
  explanation:"無汗・強い悪寒・関節痛を伴う実証の太陽病で、葛根湯より強力な発汗解表作用を持つ麻黄湯が適応します。体力充実者に用いる点が要点です。急性発熱性疾患のため、診断には気血水ではなく六病位を用います。",
  shinsatsu:{ganshoku:"顔色は赤く強い紅潮、皮膚は乾燥している",hyojo:"苦悶表情、眉間にしわを寄せている",zetsudan:"舌質：淡紅　舌苔：薄白苔（乾燥気味）",myakudan:"浮緊有力（力強く浮いている）",fukudan:"腹力充実、腹直筋の強い緊張"},
  kotenseki:{source:"傷寒論（張仲景・後漢）第35条",quote:"太陽病、頭痛、発熱、身疼、腰痛、骨節疼痛、悪風、無汗而喘者、麻黄湯主之。",modern:"「頭痛・発熱・全身の痛み・腰痛・関節痛があり、風を嫌い、汗が出ず喘鳴のある太陽病には麻黄湯を用いよ」という意味です。麻黄の峻発汗作用が中心で、実証者専用の強力な解表剤です。虚証・高齢者・心臓病のある方には禁忌となる点も重要な教育ポイントです。"}},
 {id:4,title:"症例4：往来寒熱と胸脇苦満",
  text:"50歳男性。1週間続く微熱が午後に上がり夜間に下がる往来寒熱。食欲不振、軽度の悪心。右季肋部を圧迫すると抵抗・圧痛（胸脇苦満）を認める。舌苔は薄黄。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"熱",hyori:"表"},
  rokubyoi:"少陽病",
  kiketsu:["該当せず"], gozou:["該当せず"],
  houshou:"小柴胡湯証", formula:"shosaikoto",
  explanation:"往来寒熱・胸脇苦満は少陽病の典型像であり、和解少陽の小柴胡湯が第一選択となります。急性発熱性疾患のため、診断には気血水ではなく六病位を用います。",
  shinsatsu:{ganshoku:"顔色はやや黄ばみがあり頬に紅みがある",hyojo:"倦怠感があり、やや不機嫌そうな表情",zetsudan:"舌質：淡紅〜紅　舌苔：薄黄苔",myakudan:"弦（弦のように張り、やや数）",fukudan:"右季肋部に抵抗・圧痛（胸脇苦満）著明"},
  kotenseki:{source:"傷寒論（張仲景・後漢）第96条",quote:"傷寒五六日、中風、往来寒熱、胸脇苦満、嘿嘿不欲飲食、心煩喜嘔…小柴胡湯主之。",modern:"「傷寒になって5〜6日で発熱と解熱を繰り返し（往来寒熱）、右脇腹が張って苦しく、食欲がなく、心が落ち着かず嘔吐しやすいものには小柴胡湯を」という意味です。柴胡が少陽の邪を散らし、黄芩が炎症を清め、半夏が悪心を止め、人参・大棗・甘草が正気を補います。"}},
 {id:5,title:"症例5：胸脇苦満＋便秘の実証体格",
  text:"55歳男性、体格良好で筋肉質。胸脇苦満が強く、上腹部の張りと便秘（3日に1回）を伴う。怒りやすく、顔面紅潮あり。脈は実で力強い。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"熱",hyori:"表"},
  rokubyoi:"少陽病",
  kiketsu:["該当せず"], gozou:["該当せず"],
  houshou:"大柴胡湯証", formula:"daisaikoto",
  explanation:"小柴胡湯証に裏実（便秘・腹部膨満）を伴った少陽陽明合病で、瀉下作用を併せ持つ大柴胡湯が適応します。体力充実者向けです。六病位としては少陽病を主体に陽明病の裏実を兼ねた状態で、診断には気血水ではなく六病位を用います。",
  shinsatsu:{ganshoku:"顔色は赤く充血した印象、体格充実",hyojo:"怒りっぽく険しい表情、額に汗",zetsudan:"舌質：紅　舌苔：黄苔",myakudan:"弦実（弦で力強い）",fukudan:"強い胸脇苦満と心下部〜側腹部に充実した抵抗"},
  kotenseki:{source:"傷寒論（張仲景・後漢）第103条",quote:"太陽病過経十余日、反二三下之、後四五日、柴胡証仍在者…大柴胡湯下之則愈。",modern:"「太陽病から10日以上経過し、下法を繰り返しても柴胡証が残り腹部充実感があるものは、大柴胡湯で瀉下せよ」という意味です。小柴胡湯に大黄・枳実・芍薬が加わり、少陽病と陽明病が合した実証に使用します。体力充実者の高血圧・肥満・脂質異常症にも現代では応用されます。"}},
 {id:6,title:"症例6：慢性的な倦怠感と食欲不振",
  text:"60歳女性。数か月続く全身倦怠感、食後の強い眠気、食欲不振、軽度の息切れ。顔色は萎黄。舌は淡で胖大、脈は弱い。立っていると疲れやすい。",
  hakko:{inyo:"陰",kyojitsu:"虚",kannetsu:"寒",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["気虚"], gozou:["脾"],
  houshou:"補中益気湯証", formula:"hochuekkito",
  explanation:"全身倦怠感・食欲不振・気力低下を中心とする脾胃気虚証で、補気健脾・升陽の補中益気湯が適応します。",
  shinsatsu:{ganshoku:"顔色は萎黄（黄土色）でハリがなく蒼白",hyojo:"元気なく疲れ果てたぼんやりとした表情",zetsudan:"舌質：淡白・胖大　舌苔：薄白苔　歯痕（＋）",myakudan:"沈細弱（沈んで細く弱い）",fukudan:"腹力著しく低下（極軟）、臍周囲に拍動触れることあり"},
  kotenseki:{source:"内外傷辨惑論（李東垣・金元時代・1247年）",quote:"脾胃気虚、怠惰嗜臥、四肢不収、肢節疼痛…補中益気湯主之。",modern:"「脾胃の気が虚して、だるくて横になりたがり、手足に力が入らないものには補中益気湯を」という意味です。金元の名医・李東垣（李杲）が創方した補気升陽の代表方剤です。黄耆・人参・白朮が気を補い、升麻・柴胡が下がった気を引き上げます（甘温除熱法）。"}},
 {id:7,title:"症例7：めまいと立ちくらみ",
  text:"38歳女性。立ち上がる際のめまい・立ちくらみを繰り返す。動悸を伴うことがあり、胃のあたりから何かが突き上がる感覚（気上衝）を自覚する。むくみやすい。",
  hakko:{inyo:"陰",kyojitsu:"虚",kannetsu:"寒",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["水滞"], gozou:["心"],
  houshou:"苓桂朮甘湯証", formula:"ryokeijutsukanto",
  explanation:"水滞による気の上衝（めまい・動悸）が中心病態で、利水・降気作用を持つ苓桂朮甘湯が適応します。",
  shinsatsu:{ganshoku:"顔色はやや蒼白、目の下にクマがある",hyojo:"めまいで不安げな、青ざめた表情",zetsudan:"舌質：淡白　舌苔：白滑苔（水分を帯びる）",myakudan:"沈弦（沈んで弦のように張る）",fukudan:"臍上部に振水音（＋）、心下部に痞え感"},
  kotenseki:{source:"傷寒論（張仲景・後漢）第67条",quote:"傷寒若吐若下後、心下逆満、気上衝胸、起則頭眩、脈沈緊…苓桂朮甘湯主之。",modern:"「吐下させた後に、みぞおちが逆に張って気が胸に突き上がり、立ち上がると頭がくらくらし、脈が沈んで緊張するものには苓桂朮甘湯を」という意味です。茯苓で水を下ろし、桂皮で気の上衝を抑え、白朮で脾を温め水を燥かし、甘草で調和します。現代では起立性低血圧・耳鳴り・動悸にも応用されます。"}},
 {id:8,title:"症例8：月経不順と下腹部の抵抗",
  text:"34歳女性。月経周期が不規則で、月経時に強い下腹部痛と暗赤色の血塊を伴う。下腹部を押すと抵抗・圧痛（瘀血の腹証）を認める。肩こりと顔のほてりもある。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"熱",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["瘀血"], gozou:["肝"],
  houshou:"桂枝茯苓丸証", formula:"keishibukuryogan",
  explanation:"下腹部の瘀血所見と月経異常を特徴とする瘀血証で、活血化瘀の桂枝茯苓丸が代表的な適応です。",
  shinsatsu:{ganshoku:"顔色は暗めで唇に色素沈着あり（瘀血顔貌）",hyojo:"下腹部痛で眉間にしわを寄せた苦悶表情",zetsudan:"舌質：暗紅〜紫舌　舌下静脈怒張　舌苔：薄白",myakudan:"沈渋（沈んで流れが悪い）",fukudan:"左下腹部に圧痛・抵抗（小腹急結）"},
  kotenseki:{source:"金匱要略（張仲景・後漢）第20篇",quote:"婦人宿有症病、経断未及三月而得漏下不止、胎動在臍上者…桂枝茯苓丸主之。",modern:"「もともと腹部に塊（症）のある婦人が、妊娠3カ月で出血が止まらず臍上に胎動がある場合は桂枝茯苓丸で瘀血を除け」という意味です。桂皮・茯苓・牡丹皮・桃仁・芍薬の5味による活血化瘀剤で、現代では月経不順・子宮筋腫・更年期の瘀血証に最もよく用いられます。"}},
 {id:9,title:"症例9：冷え症とめまい（血虚水滞）",
  text:"29歳女性。冷え症が強く、特に下肢が冷たい。月経時に軽い下腹部痛、めまい、むくみやすい。顔色は不良で疲れやすい。舌質は淡白。",
  hakko:{inyo:"陰",kyojitsu:"虚",kannetsu:"寒",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["血虚","水滞"], gozou:["肝","脾"],
  houshou:"当帰芍薬散証", formula:"tokishakuyakusan",
  explanation:"血虚と水滞が併存する虚証の婦人科疾患で、養血・利水を兼ねる当帰芍薬散が適応します。桂枝茯苓丸（瘀血実証）との鑑別が要点です。",
  shinsatsu:{ganshoku:"顔色は蒼白で血の気がなく、顔に軽いむくみ",hyojo:"疲労感でぼんやりした、元気のない表情",zetsudan:"舌質：淡白　舌苔：薄白苔",myakudan:"細弱（細くて弱い）",fukudan:"腹部軟弱、臍周囲に水分穴の圧痛あり"},
  kotenseki:{source:"金匱要略（張仲景・後漢）第20篇",quote:"婦人腹中諸疾痛、当帰芍薬散主之。",modern:"「婦人のさまざまな腹痛に当帰芍薬散を用いよ」という簡潔な条文です。当帰・川芎・芍薬で血虚を補い血行を改善し、茯苓・白朮・沢瀉で水滞（浮腫・めまい）を取り除く、補血利水の代表方剤です。桂枝茯苓丸（瘀血・実証）と対比して「虚証・血虚の婦人科疾患」に用いる重要な鑑別ポイントです。"}},
 {id:10,title:"症例10：高齢者の腰痛と頻尿",
  text:"72歳男性。慢性的な腰痛と夜間頻尿（3〜4回／夜）。下肢の冷えとだるさが強く、足腰に力が入らない感覚がある。脈は沈んで弱い。",
  hakko:{inyo:"陰",kyojitsu:"虚",kannetsu:"寒",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["陽虚"], gozou:["腎"],
  houshou:"八味地黄丸証", formula:"hachimijiogan",
  explanation:"腰痛・夜間頻尿・下肢の冷えを伴う腎陽虚証の典型で、温補腎陽の八味地黄丸が代表的な適応です。",
  shinsatsu:{ganshoku:"顔色は暗くくすんだ黒ずんだ色調（腎虚顔貌）",hyojo:"疲労・虚脱感が強くどんよりとした表情",zetsudan:"舌質：淡白潤　舌苔：薄白",myakudan:"沈細弱（沈んで細く弱い）",fukudan:"臍下軟弱（臍下不仁）、下腹部全体に弛緩感"},
  kotenseki:{source:"金匱要略（張仲景・後漢）第6篇",quote:"虚労腰痛、少腹拘急、小便不利者、八味腎気丸主之。",modern:"「虚弱による腰痛、下腹部のひきつり、排尿困難のあるものには八味腎気丸（八味地黄丸）を用いよ」という意味です。六味地黄丸（腎陰を補う）に桂皮・附子（温陽）を加えた方剤で、腎陽虚証の代表処方です。「腎は命門の火を蔵す」という理論に基づき、加齢による冷え・腰痛・頻尿・性機能低下に広く応用されます。"}},

 {id:11,title:"症例11：神経過敏と不眠（陰陽失調）",
  text:"40歳男性。仕事のストレスから不眠と動悸が続く。夜中に目が覚めて寝つけず、昼間も疲れやすく集中力が低下。夢が多く、小便が近い。腹部は軟弱。脈は浮きやすく細い。",
  hakko:{inyo:"陰",kyojitsu:"虚",kannetsu:"寒",hyori:"裏"},
  rokubyoi:"該当せず",
  kiketsu:["気虚","気逆"], gozou:["心","腎"],
  houshou:"桂枝加竜骨牡蛎湯証", formula:"keishikaryu",
  explanation:"陰陽不交・精気固渋不能の状態で、桂枝湯に龍骨・牡蛎を加え精神を安定させ不眠・神経過敏を治療します。金匱要略「失精家」の方証であり、虚労に伴う精神症状の代表方剤です。",
  shinsatsu:{ganshoku:"顔色はやや蒼白で疲れた印象",hyojo:"不安げで目にクマがある",zetsudan:"舌質：淡白　舌苔：薄白",myakudan:"浮細（浮いていて細い）",fukudan:"腹力弱、腹直筋に軽度の緊張あり（腹直筋拘急軽度）"},
  kotenseki:{source:"金匱要略（張仲景・後漢）血痺虚労病篇",quote:"夫失精家、少腹弦急、陰頭寒、目眩、髪落、脈極虚芤遅…桂枝加竜骨牡蛎湯主之。",modern:"「精を漏らしやすい（または精力が衰えた）人が、下腹部のひきつり・陰部の冷え・目眩・脱毛を訴え脈が極めて弱い場合は桂枝加竜骨牡蛎湯を用いよ」という意味です。桂枝湯で表虚を治し、龍骨・牡蛎で精神を落ち着かせ精気を固めます。現代では不眠・神経症・夜尿症・ED・夢精に広く応用されます。"}},
 {id:12,title:"症例12：精神不安と不眠（少陽・痰熱）",
  text:"48歳男性。高ストレスの管理職。不眠（入眠困難・中途覚醒）、動悸、胸部の圧迫感、イライラ、口苦がある。頭重感と肩こりも強い。便は硬め。脈は弦。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"熱",hyori:"表"},
  rokubyoi:"少陽病",
  kiketsu:["該当せず"], gozou:["該当せず"],
  houshou:"柴胡加竜骨牡蛎湯証", formula:"saikokaryukotsu",
  explanation:"少陽病に痰熱が加わり心神が乱れた状態です。傷寒論では下法後の胸満・煩驚・妄言・小便不利に用います。柴胡・黄芩で少陽の熱を清め、龍骨・牡蛎・茯苓で精神を安定させます。",
  shinsatsu:{ganshoku:"顔色は赤みがありやや紅潮",hyojo:"緊張感があり眉間にしわを寄せた表情",zetsudan:"舌質：紅　舌苔：黄腻苔",myakudan:"弦滑（弦でなめらかに流れる）",fukudan:"右季肋部に軽度の胸脇苦満、臍周囲に力あり"},
  kotenseki:{source:"傷寒論（張仲景・後漢）第107条",quote:"傷寒八九日、下之、胸満煩惊、小便不利、讝語、一身尽重、不可転側者、柴胡加竜骨牡蛎湯主之。",modern:"「傷寒8〜9日で下法を用いた後、胸が張り、びくびくと驚きやすく、小便が出にくく、うわごとを言い、全身が重く寝返りが打てないものには柴胡加竜骨牡蛎湯を用いよ」という意味です。現代では高血圧・神経症・更年期の精神不安・ADHD様症状などに応用されます。"}},
 {id:13,title:"症例13：皮膚の化膿性疾患（表熱湿毒）",
  text:"22歳男性。顔面・背中を中心に多数の炎症性ざ瘡（にきび）が出現。発赤・腫脹・膿栓を伴う。皮膚は脂っぽく、ストレス時に悪化。大便は軟便気味。",
  hakko:{inyo:"陽",kyojitsu:"実",kannetsu:"熱",hyori:"表"},
  rokubyoi:"該当せず",
  kiketsu:["気滞"], gozou:["肺","肝"],
  houshou:"十味敗毒湯証", formula:"jumihaidokuto",
  explanation:"皮膚の表在する熱毒・湿毒を解毒排膿する方剤です。葛根・独活・柴胡で解表し、荊芥・防風・連翹で熱毒を清め、桔梗・甘草で排膿を促します。江戸の名医・華岡青洲が創方した日本独自の処方です。",

let state = {
  step: 0, // 0 = case select
  caseIdx: null,
  hakkoAnswer: {},
  rokubyoiAnswer: null,
  kiketsuAnswer: [],
  gozouAnswer: [],
  houshouAnswer: null,
  chihoAnswer: "",

  scored: false,
};

const STEPS = ["症例","八綱","六病位・気血水・五臓","方証","治法","生薬選択","結果"];

/* ============================== RENDER HELPERS ============================== */

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function renderProgress(){
  const bar=document.getElementById('progressBar');
  bar.innerHTML="";
  STEPS.forEach((s,i)=>{
    const span=document.createElement('span');
    span.textContent=(i+1)+". "+s;
    if(i===state.step) span.className="active";
    else if(i<state.step) span.className="done";
    bar.appendChild(span);
  });
}

function currentCase(){ return state.caseIdx===null?null:CASES[state.caseIdx]; }

function donutSVG(pct,color,size,sw){
  pct = Math.max(0,Math.min(100,pct));
  const r=(size-sw)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2d9c9" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+size*0.055}" text-anchor="middle" font-size="${size*0.22}" fill="#2d2a26" font-weight="bold">${pct}%</text>
  </svg>`;
}

/* 患者イラスト：初診時／治療後（改善 or 反応乏しい）を簡易ピクトグラムで表現 */
function patientSVG(mode){
  // mode: "before" | "improved" | "poor"
  const skin = mode==='before' ? '#d8c9a8' : (mode==='improved' ? '#f3c89a' : '#cdbfa0');
  const cheek = mode==='improved' ? '#e8896f' : 'none';
  const faceY = mode==='improved' ? 70 : 78;
  const bodyTilt = mode==='improved' ? 0 : (mode==='before' ? 6 : 9);
  const mouth = mode==='improved'
    ? `<path d="M78 94 Q100 116 122 94" stroke="#5a3a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
       <path d="M78 94 Q100 116 122 94" stroke="none" fill="#fff" opacity="0.4"/>`
    : (mode==='before'
        ? `<path d="M85 100 Q100 95 115 100" stroke="#6b5a44" stroke-width="3" fill="none" stroke-linecap="round"/>`
        : `<line x1="84" y1="101" x2="116" y2="101" stroke="#6b5a44" stroke-width="3" stroke-linecap="round"/>`);
  const eyes = mode==='improved'
    ? `<path d="M78 79 q7 -9 14 0" stroke="#3a2c20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
       <path d="M108 79 q7 -9 14 0" stroke="#3a2c20" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    : `<line x1="80" y1="80" x2="90" y2="80" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>
       <line x1="110" y1="80" x2="120" y2="80" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>`;
  const arms = mode==='improved'
    ? `<path d="M70 145 Q40 110 35 80" stroke="${skin}" stroke-width="14" fill="none" stroke-linecap="round"/>
       <path d="M130 145 Q160 110 165 80" stroke="${skin}" stroke-width="14" fill="none" stroke-linecap="round"/>`
    : `<path d="M70 150 Q55 175 60 200" stroke="${skin}" stroke-width="14" fill="none" stroke-linecap="round"/>
       <path d="M130 150 Q145 175 140 200" stroke="${skin}" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  const sweat = (mode!=='improved') ? `<path d="M132 60 q6 8 0 14 q-6 -2 -3 -8 q-3 -3 3 -6" fill="#9fc6e0"/>` : '';
  const extra = mode==='poor' ? `<line x1="60" y1="40" x2="50" y2="30" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>` : '';
  return `<svg width="150" height="220" viewBox="0 0 200 220" transform="rotate(${bodyTilt} 100 150)">
    <ellipse cx="100" cy="205" rx="55" ry="10" fill="#e7ddc7"/>
    <rect x="70" y="140" width="60" height="65" rx="20" fill="${mode==='improved'?'#7fa896':'#9a9180'}"/>
    ${arms}
    <circle cx="100" cy="${faceY}" r="40" fill="${skin}"/>
    ${cheek!=='none' ? `<circle cx="78" cy="88" r="7" fill="${cheek}" opacity="0.6"/><circle cx="122" cy="88" r="7" fill="${cheek}" opacity="0.6"/>` : ''}
    ${eyes}
    ${mouth}
    ${sweat}
    ${extra}
  </svg>`;
}

function patientImg(mode){
  const id = String(CASES[state.caseIdx].id).padStart(2,'0');
  return `<img class="patient-photo ${mode}" src="img/case${id}_${mode}.jpg" alt="患者の様子（${mode==='before'?'初診時':mode==='improved'?'改善後':'反応乏しい'}）" loading="lazy" onerror="swapToSVG(this,'${mode}')">`;
}
function swapToSVG(img,mode){ img.outerHTML = patientSVG(mode); }

function goStep(n){ state.step=n; render(); }

function resetForNewCase(idx){
  state.caseIdx=idx;
  state.step=1;
  state.hakkoAnswer={};
  state.rokubyoiAnswer=null;
  state.kiketsuAnswer=[];
  state.gozouAnswer=[];
  state.houshouAnswer=null;
  state.chihoAnswer="";
  state.basket={};
  state.scored=false;
  render();
}

/* ============================== PROGRESS / MASTERY ============================== */

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('kampoProgress')||'{"attempts":[]}'); }
  catch(e){ return {attempts:[]}; }
}

function saveAttempt(caseIdx, scores){
  const prog=loadProgress();
  prog.attempts.push({ caseId:CASES[caseIdx].id, ts:Date.now(), scores });
  localStorage.setItem('kampoProgress', JSON.stringify(prog));
}

function getBestScores(){
  const prog=loadProgress();
  const best={};
  prog.attempts.forEach(a=>{
    if(!best[a.caseId]||a.scores.overall>best[a.caseId].overall) best[a.caseId]=a.scores;
  });
  return best;
}

function getCategoryAverages(best){
  const vals=Object.values(best);
  if(!vals.length) return null;
  const keys=['hakko','rokubyoi','kiketsu','houshou','herbs'];
  const avgs={};
  keys.forEach(k=>{ avgs[k]=Math.round(vals.reduce((s,v)=>s+(v[k]||0),0)/vals.length); });
  avgs.overall=Math.round(vals.reduce((s,v)=>s+(v.overall||0),0)/vals.length);
  return avgs;
}

function getMasteryLevel(pct){
  if(pct>=90) return {label:'達人',stars:5,color:'#7a5c3e',desc:'漢方診断の高い習熟度に達しています'};
  if(pct>=75) return {label:'上級',stars:4,color:'#3d7a52',desc:'臨床応用ができるレベルです'};
  if(pct>=60) return {label:'中級',stars:3,color:'#3d6e8f',desc:'重要方剤の方証を把握できています'};
  if(pct>=40) return {label:'初学',stars:2,color:'#9c7b4f',desc:'基本的なパターンが身についてきました'};
  return {label:'入門',stars:1,color:'#888888',desc:'まずは基礎から取り組みましょう'};
}

  if(i>=0) arr.splice(i,1); else arr.push(v);

/* ============================== SCORING ============================== */

function scoreHakko(c){
  let correct=0; const total=4;
  const detail = Object.keys(HAKKO_OPTIONS).map(k=>{
    const ok = state.hakkoAnswer[k]===c.hakko[k];
    if(ok) correct++;
    return {key:k, label:HAKKO_LABEL[k], your:state.hakkoAnswer[k]||'(未選択)', correctAns:c.hakko[k], ok};
  });
  return {correct,total,detail,pct:Math.round(100*correct/total)};
}

function scoreKiketsu(c){
  const yourSet=new Set([...state.kiketsuAnswer, ...state.gozouAnswer]);
  const correctSet=new Set([...c.kiketsu, ...c.gozou]);
  let hit=0;
  correctSet.forEach(v=>{ if(yourSet.has(v)) hit++; });
  const extra = [...yourSet].filter(v=>!correctSet.has(v));
  const union = new Set([...yourSet,...correctSet]).size || 1;
  const pct = Math.round(100*hit/union);
  return {hit, correctTotal:correctSet.size, extra, yourSet:[...yourSet], correctSet:[...correctSet], pct};
}

function scoreHoushou(c){
  return {ok: state.houshouAnswer===c.houshou, your:state.houshouAnswer, correctAns:c.houshou};
}

function scoreRokubyoi(c){
  return {ok: state.rokubyoiAnswer===c.rokubyoi, your:state.rokubyoiAnswer||'(未選択)', correctAns:c.rokubyoi};
}

function scoreHerbs(c){
  const formula = FORMULA_MAP[c.formula];
  const correctIds = Object.keys(formula.comp);
  const yourIds = Object.keys(state.basket);
  const correctSet = new Set(correctIds);
  const yourSet = new Set(yourIds);
  let hit=0, doseOk=0;
  correctIds.forEach(id=>{
    if(yourSet.has(id)){
      hit++;
      const cd=formula.comp[id], yd=state.basket[id];
      if(Math.abs(cd-yd) <= Math.max(1, cd*0.3)) doseOk++;
    }
  });
  const missing = correctIds.filter(id=>!yourSet.has(id));
  const extra = yourIds.filter(id=>!correctSet.has(id));
  const recall = correctIds.length? hit/correctIds.length : 1;
  const precision = yourIds.length? hit/yourIds.length : 0;
  const f1 = (recall+precision)>0 ? 2*recall*precision/(recall+precision) : 0;
  const dosePct = hit? Math.round(100*doseOk/hit) : 0;
  return {formula, correctIds, yourIds, missing, extra, hit, recall, precision, f1, dosePct,
    pct: Math.round(100*f1)};
}

function renderResult(){
  const c=currentCase();
  const app=document.getElementById('app');
  app.innerHTML="";

  const sH=scoreHakko(c), sRo=scoreRokubyoi(c), sK=scoreKiketsu(c), sHo=scoreHoushou(c), sHe=scoreHerbs(c);
  const overall = Math.round((sH.pct + (sRo.ok?100:0) + sK.pct + (sHo.ok?100:0) + sHe.pct)/5);
  saveAttempt(state.caseIdx, {hakko:sH.pct, rokubyoi:sRo.ok?100:0, kiketsu:sK.pct, houshou:sHo.ok?100:0, herbs:sHe.pct, overall});

  const panel=el(`<div class="panel">
    <h2>採点結果：${c.title}</h2>
    <div class="score-box">
      <div class="score-card">${donutSVG(overall,'#7a5c3e',112,15)}<div class="label">総合正解率</div></div>

      <div class="score-card">${donutSVG(sHe.pct,'#b1763a',92,12)}<div class="label">生薬構成(F1)</div></div>
    </div>
    <p class="note">各円グラフの色付き部分が「正解率（一致した割合）」を表します。残りの灰色部分が不正解・不一致の割合です。</p>
  </div>`);
  app.appendChild(panel);

  // 患者イラスト（生薬構成の正解率75%以上で改善イメージ）
  const improved = sHe.pct >= 75;
  const patientPanel=el(`<div class="panel">
    <h3>患者さんの様子（生薬選択の正解率：${sHe.pct}%）</h3>
    <div class="row" style="justify-content:center; align-items:center; gap:40px;">
      <div style="text-align:center;">${patientImg('before')}<div class="label">初診時</div></div>
      <div style="font-size:28px;color:var(--accent2);">→</div>
      <div style="text-align:center;">${patientImg(improved?'improved':'poor')}<div class="label">治療後</div></div>
    </div>
    <p class="note" style="text-align:center;">
      ${improved
        ? '生薬構成の正解率が75％以上のため、選んだ漢方薬が治法に合致し、症状が改善して元気になったイメージです。'
        : '生薬構成の正解率が75％未満のため、治法と生薬の選択がずれており、症状の改善が乏しいイメージです。生薬構成の比較・不正解の理由を確認してみましょう。'}
    </p>
  </div>`);
  app.appendChild(patientPanel);

  // 六病位詳細
  const roPanel=el(`<div class="panel"><h3>六病位の判定</h3>
    <p>あなたの解答：<strong class="${sRo.ok?'tag-ok':'tag-miss'}">${sRo.your}</strong></p>
    <p>正解：<strong>${sRo.correctAns}</strong></p>
    ${!sRo.ok?`<div class="explanation"><strong>不正解の理由：</strong>正解は「${sRo.correctAns}」です。${ROKUBYOI_MEANING[sRo.correctAns]}</div>`:'<p class="note tag-ok">六病位の判定は正解です。</p>'}
  </div>`);
  app.appendChild(roPanel);

  // 八綱詳細
  const wrongHakko = sH.detail.filter(d=>!d.ok);
  const hakkoPanel=el(`<div class="panel"><h3>八綱の判定</h3><table class="compare-table">
    <tr><th>項目</th><th>あなたの解答</th><th>正解</th><th>判定</th></tr>
    ${sH.detail.map(d=>`<tr><td>${d.label}</td><td>${d.your}</td><td>${d.correctAns}</td><td class="${d.ok?'tag-ok':'tag-miss'}">${d.ok?'○':'×'}</td></tr>`).join('')}
  </table>
  ${wrongHakko.length? wrongHakko.map(d=>`<div class="explanation"><strong>${d.label}が不正解の理由：</strong>正解は「${d.correctAns}」です。${HAKKO_MEANING[d.key][d.correctAns]}</div>`).join('') : '<p class="note tag-ok">八綱はすべて正解です。</p>'}
  </div>`);
  app.appendChild(hakkoPanel);

  // 気血水詳細
  const missingKiketsu = sK.correctSet.filter(v=>!sK.yourSet.includes(v));
  const kPanel=el(`<div class="panel"><h3>気血水・五臓の判定</h3>
    <p>あなたの解答：${sK.yourSet.length?sK.yourSet.join('、'):'(なし)'}</p>
    <p>正解：${sK.correctSet.join('、')}</p>
    ${sK.extra.length?`<p class="tag-extra">余分な選択：${sK.extra.join('、')}</p>`:''}
    ${missingKiketsu.length? missingKiketsu.map(v=>`<div class="explanation"><strong>「${v}」を見落とした理由の手がかり：</strong>${KIKETSU_MEANING[v]||GOZOU_MEANING[v]||''}</div>`).join('') : '<p class="note tag-ok">気血水・五臓のパターンはすべて選択できています。</p>'}
  </div>`);
  app.appendChild(kPanel);

  // 方証
  const yourFormula = FORMULAS.find(f=>f.houshou===sHo.your);
  const hoPanel=el(`<div class="panel"><h3>方証の判定</h3>
    <p>あなたの解答：<strong class="${sHo.ok?'tag-ok':'tag-miss'}">${sHo.your||'(未選択)'}</strong>${yourFormula?`（治法：${yourFormula.chiho}）`:''}</p>
    <p>正解：<strong>${sHo.correctAns}</strong>（治法：${sHe.formula.chiho}）</p>
    ${!sHo.ok?`<div class="explanation"><strong>不正解の理由：</strong>${yourFormula?`選択した「${sHo.your}」は治法が「${yourFormula.chiho}」であり、本症例の八綱・気血水所見とは一致しません。`:'方証が選択されていません。'}本症例は ${c.explanation}</div>`:''}
  </div>`);
  app.appendChild(hoPanel);

  // 生薬構成
  const allIds = new Set([...sHe.correctIds, ...sHe.yourIds]);
  let herbRows = [...allIds].sort((a,b)=>HERB_MAP[a].name.localeCompare(HERB_MAP[b].name,'ja')).map(id=>{
    const inCorrect = sHe.correctIds.includes(id);
    const inYours = sHe.yourIds.includes(id);
    let mark, cls;
    if(inCorrect && inYours){ mark='一致'; cls='tag-ok'; }
    else if(inCorrect && !inYours){ mark='不足'; cls='tag-miss'; }
    else { mark='余分'; cls='tag-extra'; }
    return `<tr><td>${HERB_MAP[id].name}</td><td>${inYours?state.basket[id]+' g':'-'}</td><td>${inCorrect?sHe.formula.comp[id]+' g':'-'}</td><td class="${cls}">${mark}</td></tr>`;
  }).join('');
  const herbReasons = [
    ...sHe.missing.map(id=>`<div class="explanation"><strong>${HERB_MAP[id].name}が不足している理由：</strong>本処方の治法「${sHe.formula.chiho}」を実現するために必要な生薬です（効能：${HERB_MAP[id].eff}）。</div>`),
    ...sHe.extra.map(id=>`<div class="explanation"><strong>${HERB_MAP[id].name}が余分である理由：</strong>効能は「${HERB_MAP[id].eff}」であり、本処方の治法「${sHe.formula.chiho}」には直接関係しません。</div>`)
  ].join('');
  const herbPanel=el(`<div class="panel"><h3>生薬構成の比較（正解処方：${sHe.formula.name}）</h3>
    <table class="compare-table"><tr><th>生薬</th><th>あなたの用量</th><th>正解の用量</th><th>判定</th></tr>${herbRows}</table>
    <p class="note">一致率（再現率）：${Math.round(sHe.recall*100)}% ／ 的中率（精度）：${Math.round(sHe.precision*100)}% ／ 一致した生薬の用量適正率：${sHe.dosePct}%</p>
    ${herbReasons || '<p class="note tag-ok">生薬構成は正解処方と完全に一致しています。</p>'}
  </div>`);
  app.appendChild(herbPanel);

  const expPanel=el(`<div class="panel"><h3>解説</h3>
    <div class="explanation">
      <p><strong>正解処方：${sHe.formula.name}</strong>（${sHe.formula.houshou}／治法：${sHe.formula.chiho}）</p>
      <p>${c.explanation}</p>
    </div>
  </div>`);
  app.appendChild(expPanel);

  // 古典出典パネル
  const kt=c.kotenseki;
  if(kt){
    const ktPanel=el(`<div class="panel"><h3>📖 古典出典：${sHe.formula.name}</h3>
      <div class="kotenseki-box">
        <div class="kotenseki-source">出典：${kt.source}</div>
        <div class="kotenseki-quote">「${kt.quote}」</div>
        <div class="kotenseki-modern"><strong>現代語解説：</strong>${kt.modern}</div>
      </div>
    </div>`);
    app.appendChild(ktPanel);
  }

  const nav=el(`<div class="panel"><div class="nav-actions">
    <button class="btn secondary" id="retryBtn">この症例をやり直す</button>
    <button class="btn" id="nextCaseBtn">スタートに戻る</button>
  </div></div>`);
  app.appendChild(nav);
  nav.querySelector('#retryBtn').onclick=()=>resetForNewCase(state.caseIdx);
  nav.querySelector('#nextCaseBtn').onclick=()=>goStep(0);

  renderProgress();
}

/* ============================== MAIN RENDER ============================== */

function render(){
  switch(state.step){
    case 0: renderCaseSelect(); break;
    case 1: renderHakko(); break;
    case 2: renderKiketsu(); break;
    case 3: renderHoushou(); break;
    case 4: renderChiho(); break;
    case 5: renderHerbSelect(); break;
    case 6: renderResult(); break;
  }
}

render();
</script>
</body>
</html>
